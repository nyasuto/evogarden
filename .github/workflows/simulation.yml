name: Run Simulation

on:
  workflow_dispatch:
  pull_request:

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Run simulation
        run: |
          go run ./cmd/evolve | tee simulation.log
      - name: Upload simulation log
        uses: actions/upload-artifact@v7
        with:
          name: simulation-log
          path: simulation.log
