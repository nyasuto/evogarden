name: Go CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      # golangci-lint reads the compiler's export data, whose format the Go
      # release cycle keeps moving forward. Pinning the linter while `stable`
      # floats lets the toolchain run ahead of it, and the run dies with
      # "export data version N is greater than maximum supported version M"
      # on a pull request that changed nothing relevant. Both sides float
      # together instead.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Format
        run: |
          make fmt | tee fmt.log
          git diff --exit-code
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
